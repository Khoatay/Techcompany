plugins { id 'com.android.application' }
android {
  namespace 'app.chillspace'
  compileSdk 34
  defaultConfig {
    applicationId "app.chillspace"
    minSdk 21
    targetSdk 34
    versionCode 3
    versionName "1.0.2"
  }
  // khoá ký app: tạo trong lúc đóng gói (xem .github/workflows/android-app.yml); ký đủ v1 + v2 + v3 để máy cũ và máy mới đều cài được
  signingConfigs {
    release {
      storeFile file(System.getenv('CS_KS') ?: 'release.keystore')
      storePassword System.getenv('CS_KS_PASS') ?: 'chillspace'
      keyAlias 'chillspace'
      keyPassword System.getenv('CS_KS_PASS') ?: 'chillspace'
      enableV1Signing true
      enableV2Signing true
      enableV3Signing true
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
