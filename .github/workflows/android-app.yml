# Đóng gói ChillSpace cho Android (.apk, dùng cho điện thoại + máy tính bảng), rồi đăng lên mục Releases.
name: App Android
on:
  push:
    branches: [claude/stoic-wozniak-1qob7m]
    paths: ['android/**', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Tạo khoá ký app
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/cs.keystore" -alias chillspace -keyalg RSA -keysize 2048 -validity 10000 -storepass "$CS_KS_PASS" -keypass "$CS_KS_PASS" -dname "CN=ChillSpace, O=ChillSpace, C=VN"
        env:
          CS_KS_PASS: chillspace-${{ github.run_id }}
      - name: Đóng gói .apk
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          CS_KS: ${{ runner.temp }}/cs.keystore
          CS_KS_PASS: chillspace-${{ github.run_id }}
      - name: Lấy số phiên bản
        id: ver
        run: |
          v=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "ChillSpace-$v.apk"
      - name: Đăng lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.v }}
          name: ChillSpace cho Android ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            **Cài trên điện thoại / máy tính bảng Android:** tải `ChillSpace-${{ steps.ver.outputs.v }}.apk` → mở file → cho phép "Cài ứng dụng không rõ nguồn gốc" → Cài đặt.
            App mở thẳng bản web ChillSpace nên tự cập nhật, không phải cài lại khi web có bản mới.
          files: ChillSpace-*.apk
